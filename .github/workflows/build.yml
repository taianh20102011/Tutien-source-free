name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: TuTienPlugin
          path: target/TuTienPlugin-*.jar

      - name: Lấy version từ pom.xml
        id: ver
        run: echo "v=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: TuTienPlugin ${{ steps.ver.outputs.v }}
          files: target/TuTienPlugin-*.jar

      - name: Publish Package (chỉ khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: mvn -B deploy -s ${{ github.workspace }}/settings.xml -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gửi thông báo & File JAR sang Discord
        if: env.DISCORD_WEBHOOK != ''
        uses: tsickert/discord-webhook@v5.4.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          filename: target/TuTienPlugin-free-${{ steps.ver.outputs.v }}.jar
          content: |
            🚀 **ĐÃ CÓ BẢN BUILD MỚI: TuTienPlugin v${{ steps.ver.outputs.v }}**
            🔗 **Commit:** https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            📝 **Nội dung:** ${{ github.event.head_commit.message }}
            🤖 **Pair Programmer:** Antigravity AI Assistant
            📦 **Tải JAR tại GitHub Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.v }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
