# ============================================================
# ĐẠO TÂM (Đạo Lộ Tu Tiên)
# Chi tiết thuộc tính, hệ số công/thủ và Đạo tùy chỉnh được cấu hình
# độc lập và đầy đủ tại file: plugins/TuTienPlugin/dao.yml
# ============================================================
dao-path:
  switch-cost: 500
  switch-cooldown-hours: 24

# ============================================================
# SEASON — "meta mùa": admin chọn 1 Class + 1 Đạo mạnh nhất mùa này
# bằng lệnh "/ttadmin season set <class> <dao>" (VD: /ttadmin season set
# KIEM_TU MA_DAO). Người chơi ĐÚNG class/đạo đó được cộng thêm % sức mạnh
# theo cấu hình dưới đây, cộng dồn (nhân) vào hệ số ATK/DEF/tu luyện sẵn có
# của class/đạo đó — không thay thế, chỉ cộng thêm.
#
# Chọn class/đạo hiện tại của mùa được LƯU RIÊNG ở season_state.yml (tự
# tạo khi dùng lệnh), KHÔNG lưu ở config.yml này — để tránh việc lưu season
# làm mất hết comment trong file config.yml. Muốn xem season hiện tại:
# "/ttadmin season info". Muốn xóa season (không ai được bonus): "/ttadmin
# season clear". Chỉ đặt class hoặc chỉ đặt đạo cũng được, không bắt buộc
# đặt cả 2 (dùng /ttadmin season set <class> <dao>, tuy cần điền cả 2 tham
# số mỗi lần set, nhưng bạn có thể set lại toàn bộ bất cứ lúc nào).
# ============================================================
season:
  enabled: true
  # % cộng thêm khi ĐÚNG class là class mạnh nhất mùa này (nhân dồn vào ATK/DEF/tốc độ tu luyện sẵn có)
  class-atk-bonus-percent: 40
  class-def-bonus-percent: 40
  class-cultivation-bonus-percent: 40
  # % cộng thêm khi ĐÚNG đạo là đạo mạnh nhất mùa này (nhân dồn vào atk-mult/def-mult của đạo đó)
  dao-atk-bonus-percent: 40
  dao-def-bonus-percent: 40
  # Broadcast toàn server mỗi khi admin đổi season bằng lệnh "season set"
  announce-on-set: true
  announce-message: "&6&l✦ MÙA MỚI! &eClass mạnh nhất: &b{class} &e| Đạo mạnh nhất: &b{dao}"

