# ============================================================
# LINH THÚ (Pet đồng hành) — cấu hình theo GIỚI, KHÔNG cần build lại plugin.
#
# Muốn đổi loại thú / model / buff cho 1 Giới -> sửa mục con trong "tiers"
# rồi chạy "/ttadmin reload" (áp dụng ngay, không cần restart server).
# Muốn thêm 1 Giới mới -> thêm 1 mục con nữa với đúng tên Giới, xong.
#
# mode cho mỗi Giới có thể là:
#   VANILLA    - mob Bukkit thường (WOLF, FOX, ALLAY, PARROT...). Luôn chạy,
#                không cần cài thêm plugin nào.
#   MYTHICMOBS - mob custom định nghĩa trong mythicmobs/Mobs/*.yml, có thể
#                gắn model 3D riêng (kỳ lân, phượng hoàng...) qua ModelEngine.
#                Cần server cài MythicMobs (miễn phí) + ModelEngine nếu muốn
#                model riêng. Xem ví dụ trong mythicmobs/Mobs/TT_Pets.yml.
#   SIMPLEPETS - dùng plugin SimplePets ngoài (có GUI quản lý pet cho người chơi).
#
# Nếu 1 Giới chọn mode mà plugin tương ứng CHƯA cài, hệ thống tự động rớt
# xuống mode kế tiếp trong "fallback-order" bên dưới — cuối cùng luôn rơi về
# VANILLA (không bao giờ thất bại hoàn toàn, kể cả server không cài gì thêm).
# ============================================================
linh-thu:
  enabled: true
  # Ưu tiên MythicMobs. Nếu thiếu MythicMobs/ModelEngine vẫn fallback vanilla.
  fallback-order: [MYTHICMOBS, SIMPLEPETS, VANILLA]
  default:
    mode: VANILLA
    entity-type: WOLF
    mythicmobs-id: "TT_Pet_LuyenKhi"
    mythicmobs-level: 1
    simplepets-type: wolf
    display-name: "Linh Thú"
    flies: false
    regen-amplifier: 0
    luck-amplifier: -1
    attack-skill: "TT_Pet_LuyenKhi_Attack"
    defend-skill: "TT_Pet_LuyenKhi_Defend"
    attack-damage: 2.0
    defend-heal-percent: 0.08
    defend-resistance-amplifier: 0
    defend-duration-seconds: 3
    attack-cooldown-seconds: 8
    defend-cooldown-seconds: 12

  # Fallback theo 5 Đại Giới nếu một stage không được khai báo.
  tiers:
    Linh Giới: {mode: VANILLA, entity-type: WOLF, display-name: "Linh Thú Linh Giới", flies: false, regen-amplifier: 0, luck-amplifier: -1}
    Đế Giới: {mode: VANILLA, entity-type: OCELOT, display-name: "Linh Thú Đế Giới", flies: false, regen-amplifier: 0, luck-amplifier: -1}
    Thánh Giới: {mode: MYTHICMOBS, entity-type: FOX, mythicmobs-id: "TT_Pet_BanThanh", display-name: "Thánh Linh Thú", flies: false, regen-amplifier: 1, luck-amplifier: 0}
    Tiên Giới: {mode: MYTHICMOBS, entity-type: ALLAY, mythicmobs-id: "TT_Pet_ChanTien", display-name: "Tiên Linh Thú", flies: true, regen-amplifier: 1, luck-amplifier: 0}
    Thiên Giới: {mode: MYTHICMOBS, entity-type: PARROT, mythicmobs-id: "TT_Pet_ThienTon", display-name: "Thiên Linh Thú", flies: true, regen-amplifier: 2, luck-amplifier: 0}

  # 25 pet — mỗi cảnh giới một con, mỗi con có skill riêng.
  stages:
    LUYEN_KHI:
      mode: MYTHICMOBS
      mythicmobs-id: "TT_Pet_LuyenKhi"
      mythicmobs-level: 1
      entity-type: WOLF
      simplepets-type: wolf
      display-name: "Thanh Vũ Lang"
      flies: false
      regen-amplifier: 0
      luck-amplifier: -1
      attack-skill: "TT_Pet_LUYEN_KHI_Attack"
      defend-skill: "TT_Pet_LUYEN_KHI_Defend"
      attack-damage: 2
      defend-heal-percent: 0.08
      defend-resistance-amplifier: 0
      defend-duration-seconds: 3
      attack-cooldown-seconds: 8
      defend-cooldown-seconds: 12
    TRUC_CO:
      mode: MYTHICMOBS
      mythicmobs-id: "TT_Pet_TrucCo"
      mythicmobs-level: 1
      entity-type: CAT
      simplepets-type: wolf
      display-name: "Linh Mộc Miêu"
      flies: false
      regen-amplifier: 0
      luck-amplifier: -1
      attack-skill: "TT_Pet_TRUC_CO_Attack"
      defend-skill: "TT_Pet_TRUC_CO_Defend"
      attack-damage: 3
