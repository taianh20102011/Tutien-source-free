  particle-density: 1.0

  # ============================================================
  # HIỆU ỨNG ITEMSADDER (tùy chọn) — thay hiệu ứng particle mặc định
  # bằng hiệu ứng riêng của bạn, KHÔNG cần sửa code, không cần build lại.
  #
  # CÁCH DÙNG:
  #   1. Làm 1 "Custom Entity" trong ItemsAdder (Blockbench + extension IA):
  #      model + particle bone + animation tùy ý, đặt 1 namespace:id riêng,
  #      ví dụ "tutien:vfx_dotpha_thanhcong".
  #   2. /iareload (hoặc restart server) để ItemsAdder nạp Custom Entity đó.
  #   3. Điền namespace:id vào đúng dòng bên dưới trong "map:".
  #   4. /ttadmin reload (hoặc restart TuTienPlugin) để áp dụng.
  #
  # QUY TẮC AN TOÀN: dòng nào để trống "" HOẶC id đó CHƯA tồn tại trong
  # ItemsAdder (làm chưa xong / gõ sai / chưa /iareload) -> plugin TỰ ĐỘNG
  # dùng lại hiệu ứng particle mặc định cho đúng sự kiện đó, KHÔNG lỗi,
  # KHÔNG mất hiệu ứng. Bạn có thể vừa chơi vừa làm dần từng cái một,
  # không cần làm hết một lúc.
  # ============================================================
  itemsadder:
    # Bật/tắt toàn bộ tính năng này. false = luôn dùng hiệu ứng particle mặc
    # định dù map bên dưới có điền ID hay không.
    enabled: true

    # Tên animation sẽ tự gọi trên Custom Entity ngay sau khi spawn (nếu
    # model của bạn có animation đó). Để trống "" nếu không cần.
    animation: ""

    # Số tick (1 tick = 0.05 giây) sau khi spawn sẽ TỰ ĐỘNG xóa Custom Entity
    # để không để rác thực thể ngoài map. 100 tick = 5 giây. Đặt 0 nếu model
    # tự hủy bằng animation riêng của nó (không cần plugin tự xóa).
    lifetime-ticks: 100

    # Ánh xạ <sự_kiện> -> <namespace:id trong ItemsAdder>. Cứ để trống ""
    # cho tới khi bạn làm xong hiệu ứng riêng cho sự kiện đó.
    #
    # RIÊNG 2 DÒNG "thi-trien-ky-nang" và "pha-bao-kich-hoat" bên dưới là hiệu
    # ứng DÙNG CHUNG mặc định cho MỌI skill chủ động / MỌI Pháp Bảo — dùng khi
    # bạn muốn 1 hiệu ứng chung cho tất cả, đỡ phải làm riêng từng cái.
    #
    # Muốn hiệu ứng RIÊNG cho TỪNG skill hoặc TỪNG Pháp Bảo (khác nhau mỗi
    # cái) thì thêm dòng mới ngay dưới "map:", dùng đúng 2 khuôn key sau:
    #   skill-<skill_id>: "namespace:id"      (skill_id xem trong SkillManager.java,
    #                                          VD: "toc_kiem", "nhat_kiem_sat"...)
    #   phabao-<ability_id>: "namespace:id"   (ability_id xem trong PhaBaoType.java,
    #                                          VD: "kiemkhi", "loiphu", "phaplucthung"...)
    # VD:
    #   skill-toc_kiem: "tutien:vfx_tockiem"
    #   phabao-loiphu: "tutien:vfx_loiphu"
    # Skill/Pháp Bảo NÀO không có dòng riêng thì tự dùng hiệu ứng CHUNG ở
    # "thi-trien-ky-nang"/"pha-bao-kich-hoat" bên dưới (hoặc particle mặc định
    # nếu cả 2 đều chưa cấu hình) — không cần khai báo hết mọi skill/pháp bảo
    # cùng lúc, làm dần cái nào cũng được.
    map:
      dot-pha-tich-luy: ""       # breakthroughCharge   - lúc đang tích Linh Khí để đột phá
      thi-luyen-song: ""         # breakthroughTrialWave - mỗi đợt sóng Thiên Kiếp thử luyện
      dot-pha-thanh-cong: ""     # breakthroughSuccess   - đột phá thành công, lên cảnh giới mới
      dot-pha-that-bai: ""       # breakthroughFail      - đột phá thất bại
      boss-xuat-hien: ""         # bossSpawnEffect       - boss Thiên Kiếp xuất hiện
      thi-trien-ky-nang: ""      # skillCast             - người chơi dùng skill chủ động
      pha-bao-kich-hoat: ""      # phaBaoCast            - kích hoạt nội tại Pháp Bảo
      linh-can-lo-dien: ""       # linhCanReveal         - lộ diện Linh Căn
      toc-lo-dien: ""            # tocReveal             - lộ diện Tộc (chủng tộc)
      dung-dan-duoc: ""          # danDuocUse            - uống Đan Dược

