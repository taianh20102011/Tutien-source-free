combat:
  pvp-enabled: true
  pvp-in-safe-zones: false
  pvp-stage-damage-scaling: true
  pvp-scaling-cap: 3.0
  lt-drop-on-pvp-death: 0.05

database:
  type: yaml
  auto-save-seconds: 300
  mysql:
    host: localhost
    port: 3306
    database: tutien
    username: root
    password: password
    pool-size: 10
    table-prefix: "tt_"


debug:
  enabled: false
  log-lk-regen: false
  log-breakthrough: true
  log-boss-spawn: true

performance:
  lk-regen-interval-ticks: 20
  nametag-update-ticks: 100
  mythiclib-sync-ticks: 600

language:
  locale: vi
  fallback: vi

# ══════════════════════════════════════════════
#  BANG "NGUOI CHOI DA BI BAN" (doc thang tu banned-players.json,
#  hoat dong voi ca /ban vanilla lan /ban cua EssentialsX vi ca hai deu
#  ghi vao file nay theo mac dinh). Dung cho hologram/GUI qua cac
#  placeholder %tutien_ban_<so_thu_tu>_name/reason/duration%.
ban-board:
  enabled: true
  # Chu ky doc lai file banned-players.json (giay). Dung qua ngan se
  # ton IO doc file lien tuc khong can thiet.
  update-interval-seconds: 30
  # So nguoi hien thi toi da (khop voi so placeholder duoc dang ky).
  top-count: 10

# ══════════════════════════════════════════════
#  LENH CONSOLE TUY CHINH KHI DAT CANH GIOI MOI (khong bat buoc)
#  %player% se duoc thay bang ten nguoi choi. Lenh chay bang CONSOLE.
#
#  LUU Y (v7.3.0): permission "tutien.<canh_gioi>" + group "tt_realm_*" +
#  prefix GIO DA duoc LuckPermsHook.java tu dong xu ly qua LuckPerms API
#  (1 lan ghi duy nhat/lan doi canh gioi, co self-heal + cache RAM).
#  KHONG can (va KHONG nen) khai bao lai lenh "lp user ... permission set/unset"
#  o day nua — truoc day moi lan sync se chay them ~25 lenh console rieng le
#  cho MOI canh gioi (unset het 24 permission cu roi set 1 cai moi), khien
#  LuckPerms phai xep hang xu ly lenh ("Another command is being executed...")
#  va ngon RAM/CPU ro ret khi nhieu nguoi choi join/dot pha cung luc (vd luc
#  restart server). Da go bo toan bo cac lenh do o day.
#
#  Chi dien vao day neu ban muon chay THEM lenh khac (khong phai LuckPerms)
#  khi nguoi choi dat 1 canh gioi cu the, VD:
#    LUYEN_KHI:
#      - "broadcast %player% da nhap mon tu tien!"
breakthrough-commands: {}

# ══════════════════════════════════════════════
#  DOT PHA QUA NPC (can plugin Citizens)
#
#  Khi "enabled: true": tai world duoc ghi trong "world" ben duoi, lenh
#  /vuottamma va /dotpha SE BI CHAN — nguoi choi bat buoc phai den gap
#  1 trong cac NPC (Citizens) co ID nam trong "npc-ids" va CLICK CHUOT
#  PHAI vao NPC do thi moi bat dau duoc Thien Dinh / Thien Kiep.
#
#  Cach lay ID NPC: dung lenh Citizens "/npc list" hoac dung "/npc select"
#  roi "/npc id" khi dang dung canh NPC do.
#
#  worlds: [] (rong) = KHONG khoa world nao (lenh /vuottamma, /dotpha van
#  dung binh thuong o moi noi, NPC chi la 1 cach dot pha THEM).
#  Dien 1 hoac NHIEU ten world (vd ["the_gioi_tu_luyen", "the_gioi_tu_luyen_nether"])
#  = TAT CA cac world trong danh sach nay deu bi khoa lenh; world nao
#  KHONG co trong danh sach thi khong bi anh huong.
#
#  npc-ids: [] = chua khai bao NPC nao (NPC se khong lam gi ca cho toi
#  khi ban dien ID vao day). Co the khai bao nhieu NPC cung luc (moi NPC
#  o 1 world khac nhau trong danh sach "worlds" cung duoc, mien la ID co
#  trong danh sach nay thi click vao la dot pha duoc).
breakthrough-npc:
  enabled: false
  worlds: []
  npc-ids: []
  block-message: "&cKhu vực này bạn phải đến gặp NPC để tiến hành Đột Phá! Không thể dùng lệnh trực tiếp."
