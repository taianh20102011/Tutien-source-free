phabao:
  drop-rate-multiplier: 1.0
  max-phabao-per-player: 6
  # Trong so RIENG cho tung loai Phap Bao khi random roi (mac dinh 1.0 = nhu
  # nhau cho MOI loai neu khong khai bao o day). So cang NHO = cang HIEM; 0
  # = loai han khoi vong random (khong bao gio roi). Ten loai lay tu enum
  # trong PhaBaoType.java (vd TRAN_THIEN_GIAP, LINH_KIEM...).
  #
  # TRAN_THIEN_GIAP: 0.02 nghia la so voi 1 loai thuong (trong so 1.0), no
  # HIEM HON KHOANG 50 LAN -> ti le roi coi nhu bang khong (theo yeu cau),
  # nhung van con 1 co hoi cuc nho thay vi bi xoa han khoi game.
  type-weight:
    TRAN_THIEN_GIAP: 0.02
  # =====================================================
  #   CUONG HOA (+1 -> +10) - lenh /cuonghoa
  # =====================================================
  # Moi cap CONG THEM % ATK/DEF/HP + sat thuong ky nang cua chinh Phap Bao
  # do (cong don theo cap, KHONG doi tier/loai). Dung /cuonghoa dabaoho de
  # (admin) phat Da Bao Ho cho nguoi choi test hoac lam phan thuong.
  enhance:
    max-level: 10
    bonus-per-level: 0.03       # +3%/cap -> +10 la +30%
    cost-tien-base: 500
    cost-tien-per-level: 300    # phi = base + per-level * cap_dich
    protection-stone-material: "AMETHYST_SHARD"
    # Ti le THANH CONG khi cuong hoa LEN cap nay (tu cap-1 -> cap). Cang cao
    # cang kho. Neu khong khai bao 1 cap nao do, dung gia tri mac dinh trong
    # code (95%/90%/85%/75%/65%/55%/45%/35%/25%/15%).
    success-rate:
      1: 0.95
      2: 0.90
      3: 0.85
      4: 0.75
      5: 0.65
      6: 0.55
      7: 0.45
      8: 0.35
      9: 0.25
      10: 0.15
    # That bai MA KHONG CO Da Bao Ho: xac suat CHI rot 1 cap thay vi vo do
    # hoan toan. So cang cao = cang "hien" (it vo do), cang thap = cang de
    # mat trang Phap Bao vinh vien.
    fail-downgrade-chance: 0.7
  # =====================================================
  #   KHAM NAM (Socketing) - lenh /khamnam
  # =====================================================
  # So o kham TOI DA theo tung tier (co the sua tung dong rieng, VD
  # "max-sockets.TIEN_PHAM: 4"). Neu khong khai bao 1 tier nao do, dung
  # mac dinh trong code: Dia/Ha=1, Trung/Thuong=2, De/Tien=3.
  socket:
    max-sockets:
      DIA_PHAM: 1
      HA_PHAM: 1
      TRUNG_PHAM: 2
      THUONG_PHAM: 2
      DE_PHAM: 3
      TIEN_PHAM: 3
    # % cong VINH VIEN cho MOI vien Ngoc kham vao (cong don neu kham nhieu
    # vien CUNG loai). Ngoc Hoa->ATK, Ngoc Bang->DEF, Ngoc Loi->HP.
    bonus-per-gem: 0.05
  renduc-success-rate:
    ha-to-trung: 0.90
    trung-to-thuong: 0.75
    thuong-to-de: 0.50
    de-to-tien: 0.25

  # =====================================================
  #   DUNG HOP (Fusion) - lenh /dunghop
  # =====================================================
  # Ghep 2 Phap Bao CUNG LOAI: 1 "goc" (giu lai, co the len tier) + 1
  # "nguyen lieu" (luon bi tieu hao). Dong an (xem "affix" ben duoi) LUON
  # duoc gop lai (khong random) - chi viec THANG PHAM la random.
  fusion:
    cost-tien-base: 1000
    cost-tien-per-tier: 500
    # So dong an toi da 1 Phap Bao co the mang cung luc sau khi gop.
    max-affix: 2
    # Ti le 1 Phap Bao MOI (khi roi ra) duoc cong san 1 dong an ngau nhien.
    roll-affix-chance: 0.15
    # Ti le THANG 1 BAC khi Dung Hop, theo tier HIEN TAI cua Phap Bao "goc".
    upgrade-chance:
      DIA_PHAM: 0.80
      HA_PHAM: 0.65
      TRUNG_PHAM: 0.50
      THUONG_PHAM: 0.35
      DE_PHAM: 0.20
      # TIEN_PHAM: da toi da, khong the thang them (chi con gop dong an).

  # Ti le proc (kich hoat khi danh trung don thuong) + do manh cua tung
  # "dong an" (hidden affix). Bo qua dong nao neu muon dung mac dinh trong
  # code (xem PhaBaoAffix.java).
  affix:
    HUT_MAU:
      chance: 0.20
      value: 0.12    # % sat thuong hoi mau
    DOT_CHAY:
      chance: 0.25
      value: 4.0     # so giay dot
    BANG_GIA:
      chance: 0.25
      value: 0.35
    CHOANG_VANG:
      chance: 0.15
      value: 2.0     # so giay choang
    CHI_MANG:
      chance: 0.15
      value: 0.50    # % sat thuong cong them
    THAN_TOC:
      chance: 0.20
      value: 3.0     # so giay Toc Do

  # =====================================================
  #   LINH THUC / SKILL NGU CANH - lenh /linhthuc
  # =====================================================
  linhthuc:
    cost-tien: 2000
    hothe:
      hp-percent: 0.20        # kich hoat khi HP con lai < 20% sau don danh
      reduce-percent: 0.5     # giam 50% sat thuong don do
      cooldown-ms: 30000
    phankich:
      cooldown-ms: 20000
      reflect-percent: 0.6    # phan lai 60% sat thuong vua nhan
      max-dot: -0.3           # cang am cang can "bi danh tu phia sau" ro rang moi tinh la backstab
    hoacanh:
      buff-percent: 0.30      # +30% sat thuong khi du dieu kien (xem PhaBaoLinhThucManager)

  # =====================================================
  #   KHI LINH (Phap Bao nuoi nhu Pet) - lenh /khilinh
  # =====================================================
  khilinh:
    # Danh sach Material duoc xem la "do rac" co the cho an. De trong =
    # dung danh sach mac dinh trong code.
    junk-items:
      - ROTTEN_FLESH
      - STRING
      - BONE
      - GUNPOWDER
      - SPIDER_EYE
      - RABBIT_HIDE
      - FEATHER
      - INK_SAC
    points-per-item: 2
    tier1-points: 100   # hao quang hat
    tier2-points: 300   # tu dong nhat do roi gan do
    tier3-points: 600   # tu dong ho tro danh quai gan nhat
    pickup-radius: 4.0
    assist-radius: 6.0
    assist-damage: 1.0

  # =====================================================
  #   DOAT BAO PVP (Nhat Dich Tich Huyet) - tu dong, khong lenh
  # =====================================================
  doatbao:
    enabled: true
    chance: 0.15                  # ti le MOI Phap Bao (khong tinh Ban Menh) bi anh huong khi chet PVP
    max-items-per-death: 1
    linhtinh-penalty-percent: 0.30
    # Neu de TRONG: dung co PVP cua the gioi (world.getPVP()) de xac dinh
    # "vung PVP". Neu khai bao tu khoa (vd "PVP", "Chien Truong"), CHI ap
    # dung khi vi tri chet nam trong 1 Zone (xem ZoneManager) co TEN chua
    # 1 trong cac tu khoa do (khong phan biet hoa/thuong).
    pvp-zone-keywords: []

# Chỉnh tay số liệu riêng cho TỪNG kỹ năng Pháp Bảo (id lấy từ PhaBaoType.java,
# vd "loiphu"). Kỹ năng NÀO không khai báo ở đây thì vẫn dùng số cứng có sẵn
# trong code (không lỗi, không cần khai báo hết mọi kỹ năng cùng lúc).
phabao-abilities:
  loiphu:
    # Sát thương MỖI LẦN sét đánh trúng (còn nhân thêm dmgMult của người dùng
    # — cảnh giới/đạo/linh căn... — nên số cuối cùng in-game sẽ cao hơn số này).
    # ĐÃ GIẢM từ 8.0 -> 5.0 theo yêu cầu "giảm sức mạnh Lôi Phù".
    damage-per-strike: 5.0
    # Cứ bao nhiêu tick kiểm tra trúng đòn 1 lần (20 tick = 1 giây). Số càng
    # lớn = bẫy đánh thưa hơn = yếu hơn (tổng sát thương ít lần hơn trong
    # cùng thời gian tồn tại).
    strike-interval-ticks: 10
    # Bẫy tồn tại bao nhiêu tick trước khi tự biến mất (20 tick = 1 giây,
    # nên 160 tick = 8 giây — ĐÚNG NHƯ SỐ NÀY GHI).
    #
    # ĐÃ SỬA 1 LỖI TÍNH TICK Ở ĐÂY khi thêm config này: bản gốc chạy task mỗi
    # 10 tick nhưng lại đếm "160" theo SỐ LẦN CHẠY chứ không phải theo tick
    # thật, nên bẫy thực tế tồn tại 160×10 = 1600 tick = 80 giây (gấp 10 lần
    # số 8 giây mà comment cũ ghi) — đây là một phần lý do Lôi Phù quá mạnh.
    # Giờ "duration-ticks" đã phản ánh đúng số tick thật (160 = 8 giây thật).
    # Nếu thấy 8 giây quá ngắn so với trước, tăng số này lên (VD 400 = 20 giây).
    duration-ticks: 160

