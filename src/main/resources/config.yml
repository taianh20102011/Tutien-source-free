# Vườn Tiên Thảo 7.2.8 — chỉ thu được trong vùng do /ttadmin vuon tao tạo.
# drop-chance là tỉ lệ mỗi lần thu hoạch một node. min-stage là ordinal của CultivationStage.
herb-garden:
  enabled: true
  require-garden: true
  harvest:
    node-respawn-seconds: 30
    min-amount: 1
    max-amount: 2
    drop-multiplier: 1.0
    give-linh-khi: false
  # Trồng linh chủng (v7.3): gieo hạt trên farmland trong vườn, cây lớn dần theo cơ
  # chế Ageable của Minecraft (tự lớn theo thời gian như cây trồng thật), hoặc lén
  # (sneak) + tay không + chuột phải vào cây để tưới linh khí bản thân, đẩy nhanh
  # sinh trưởng. Thu hoạch (phá cây khi đã lớn hết cỡ) cho nhiều & tốt hơn hái node.
  plant:
    enabled: true
    water-linh-khi-cost-percent: 5.0
    water-age-boost: 1
    water-cooldown-seconds: 120
    min-amount: 2
    max-amount: 4
    wild-seed-chance: 0.08
  regions: {}

herbs:
  types:
    linh_thao:
      name: "Linh Thảo"
      color: "§a"
      block: SHORT_GRASS
      min-stage: 0
      drop-chance: 0.55
      lt-value: 5
      lk-percent: 0.002
      plantable: true
      seed-block: WHEAT
      grow-yield-multiplier: 2.0
      premium-chance: 0.1
    hoa_thao:
      name: "Hoa Thảo"
      color: "§c"
      block: POPPY
      min-stage: 0
      drop-chance: 0.45
      lt-value: 8
      lk-percent: 0.003
      plantable: true
      seed-block: SWEET_BERRY_BUSH
      grow-yield-multiplier: 2.0
      premium-chance: 0.1
    tuyet_thao:
