cultivation:
  linh-khi-per-mob: 80
  linh-khi-per-player-kill: 500
  # Mau toi thieu de 1 quai co ten rieng (name tag) duoc tinh la "boss"
  # (thuong x10 linh khi). TRUOC DAY chi can co ten la tinh boss -> nguoi
  # choi co the dat ten cho quai thuong (vd con ga) de cay linh khi/boss-
  # kill gia mao. Boss that (Vuot Kiep >=400hp, Huyet Cot Ma Vuong 250-
  # 500hp) deu cao hon nguong nay rat nhieu; mob vanilla manh nhat (Iron
  # Golem/Ravager) chi ~100hp - nen 150 la nguong an toan, khong anh
  # huong toi cac boss that.
  boss-min-health: 150.0

  # CAC MUC DUOI DAY TRUOC DAY BI THUT NHAM VAO "world-boss:" (loi YAML
  # indentation, khong lien quan gi toi Boss Toi Thuong) — da chuyen ve
  # dung cho tai day. Doc ky ghi chu tren tung dong: mot vai gia tri VAN
  # CHUA duoc code doc toi (con "chet"), da ghi ro de tranh nham lan.
  # CHUA duoc code doc toi o dau ca — Kill Boss van dung cong thuc
  # "linh-khi-per-mob" x10 (xem CombatListener), khong dung so rieng nay.
  linh-khi-per-boss-kill: 2000
  # CHUA duoc code doc toi — LK tu thao duoc dung "lk-percent" rieng cua
  # tung loai trong "herbs.types.*", khong dung so gop nay.
  linh-khi-per-herb: 150
  # CHUA co tinh nang AFK regen nao trong code doc gia tri nay ca.
  linh-khi-afk-rate: 8
  # CHUA duoc code doc toi o dau ca.
  stage-lk-rate-nerf: 0.99
  meditation:
    # CHUA duoc code doc toi — MeditationSystem tinh LK/giay theo % LK toi
    # da (0.5%-3% tuy canh gioi), khong dung so LK/giay co dinh nay.
    lk-per-second: 28
    # CHUA duoc code doc toi — vung Linh Mach hien dang nhan x2.0 (hardcode
    # trong MeditationSystem), khong dung so 3.5 nay.
    linh-mach-multiplier: 3.5
    # CHUA duoc code doc toi — chua co co che rieng cho Si Vuong trong vong
    # lap thien dinh.
    si-vuong-multiplier: 6.0
  breakthrough:
    # CHUA duoc code doc toi — ti le thanh cong Thien Kiep hien tinh theo
    # bang rieng CultivationStage#getBreakthroughDifficulty() cho tung canh
    # gioi (+ dieu chinh theo Linh Can/Dao/Toc), khong dung 1 so chung nay.
    base-success-rate: 0.88
    # DA duoc code doc (xem PlayerData#failBreakthrough) — dot pha that
    # bai se tut dung so cap nay (mac dinh 1 neu bo dong nay).
    fail-rank-loss: 1
    # DA duoc code doc (xem BreakthroughManager#runTrial) — khoang cach
    # giua 2 song Thien Kiep lien tiep.
    wave-interval-seconds: 2
    # DA duoc code doc (xem BreakthroughManager#runTrial) — chinh DO KHO
    # Thien Kiep THEO TUNG KHOANG CANH GIOI ma khong can sua code/build lai.
    # Sat thuong 1 song = maxHP * (dmg-base cua khoang canh gioi tuong ung)
    # * (0.8 -> 1.2 ngau nhien). "-start" la sat thuong o canh gioi DAU
    # khoang, "-step" la muc tang THEM cho MOI canh gioi trong khoang do.
    # "vo-thuong" la so co dinh cho canh gioi cuoi cung (khong co step).
    #
    # Vi du khoang Linh+De (ordinal 0-9, 10 canh gioi): dmg = linh-de-start
    # + ordinal * linh-de-step -> voi mac dinh o duoi: canh gioi dau (ord 0)
    # = 11%, canh gioi cuoi khoang (ord 9) = 11% + 9*0.8% = 18.2% moi song.
    trial:
      dmg-base:
        linh-de-start: 0.11   # ordinal 0-9   (truoc: 0.07)
        linh-de-step: 0.008   # (truoc: 0.005)
        thanh-start: 0.18     # ordinal 10-14 (truoc: 0.12)
        thanh-step: 0.015     # (truoc: 0.01)
        tien-start: 0.28      # ordinal 15-19 (truoc: 0.18)
        tien-step: 0.04       # (truoc: 0.03)
        thien-start: 0.50     # ordinal 20-23 (truoc: 0.35)
        thien-step: 0.13      # (truoc: 0.10)
        vo-thuong: 0.95       # ordinal 24 - Vo Thuong Chi Ton (truoc: 0.85)
      # % maxHP hoi lai sau MOI song. Day la ly do chinh khien Thien Kiep
      # qua de o ban cu (0.26 = hoi gan het sat thuong vua nhan) -> GIAM
      # xuong con 0.12 de sat thuong tich luy that su qua tung song.
      heal-per-wave: 0.12   # (truoc: 0.26)
      # Hoi phuc khong bao gio vuot qua % maxHP nay (ke ca cong don nhieu song).
      heal-cap-percent: 0.75   # (truoc: 0.85)
      # Khi HP < 15% maxHP sau 1 song, co them 1 lan roi xac suat that bai =
      # (1 - do-de-cua-canh-gioi) * so nay. So cang cao = cang de chet khi
      # mau thap. "Do de" xem CultivationStage#getBreakthroughDifficulty().
      low-hp-fail-chance-multiplier: 0.65   # (truoc: 0.5)
    boss-arena:
      # LUU Y QUAN TRONG: toan bo he thong Boss Arena (TribulationBossArena)
      # da duoc code day du (xay tuong barrier, spawn boss theo cap do 1-48,
      # timeout...) NHUNG hien KHONG duoc goi o dau trong luong dot pha ca
      # (BreakthroughManager#successTrial hoan tat dot pha thang, khong goi
      # TribulationBossArena#startBossChallenge). Toan bo muc "boss-arena"
      # nay (ke ca "enabled") CHUA CO TAC DUNG GI trong game cho toi khi
      # tinh nang duoc noi lai vao luong dot pha.
      enabled: true
      radius: 9
      height: 5
      timeout-minutes: 15
      boss-hp-multiplier: 0.75
      boss-dmg-multiplier: 0.75

# ─────────────────────────────────────────────────────────────
# BOSS TỐI THƯỢNG — world boss tự động (can MythicMobs, xem
# mythicmobs/Mobs/TT_BossToiThuong.yml). Xuat hien theo lich, nhieu
# nguoi choi cung danh chung; ai dong gop du % sat thuong deu duoc tinh
# cong (khong chi rieng nguoi ra don cuoi).
# ─────────────────────────────────────────────────────────────
world-boss:
  enabled: true
  mob-id: "TT_BossToiThuong"
  mob-level: 5

  # CHE DO XUAT HIEN:
  #  "interval"    -> xuat hien lai sau moi X gio (tinh tu lan spawn truoc,
  #                    kể cả qua restart server - luu trong worldboss_state.yml)
  #  "fixed-times" -> xuat hien dung vao cac gio co dinh trong ngay (gio server)
  spawn-mode: "interval"
  interval-hours: 6
  fixed-times: ["12:00", "20:00"]   # Chi dung khi spawn-mode: fixed-times

  world: "world"
  x: 0.5
  y: 100
  z: 0.5
  # Tu dong do xuong tim mat dat trong gan toa do tren, tranh spawn ket
  # trong khoi/lo lung giua khong khi.
  find-safe-ground: true

  # Bao truoc bao nhieu giay (broadcast + am thanh) truoc khi boss thuc
  # su xuat hien, de nguoi choi kip tap hop. 0 = xuat hien ngay khong bao.
  warning-seconds-before: 60

  # Tu huy (khong thuong) neu khong ai ha duoc trong X phut.
  timeout-minutes: 45

  # Ty le % TOI THIEU tren tong sat thuong ca tran de duoc tinh "co cong"
  # giet boss (nhan Boss Toi Thuong kill + thuong). 0.02 = 2%.
  min-damage-percent-for-credit: 0.02

  linh-khi-reward: 5000
  tien-reward: 20000

economy:
  # === TIỀN — chỉnh ở đây để custom toàn bộ tốc độ kiếm/tiêu Tiền ===
  tien-ten-hien-thi: "Tiền"                 # Tên hiển thị cho đơn vị tiền tệ
  tien-per-mob-base: 2                      # Tiền cơ bản/mob giết được, nhân theo (cảnh giới+1)
  tien-per-mob-cap: 50                      # Trần tiền cơ bản/mob (trước khi nhân hệ số loại quái)
  tien-mob-multiplier-thuong: 1.0           # Zombie, Skeleton, Spider...
  tien-mob-multiplier-kha: 1.3              # Creeper, Cave Spider
  tien-mob-multiplier-nguy-hiem: 1.8        # Witch, Pillager, Vindicator
  tien-mob-multiplier-cao: 2.5              # Blaze, Ghast
  tien-mob-multiplier-am: 2.0               # Enderman, Drowned
  tien-mob-multiplier-tinh-anh: 3.0         # Piglin Brute
  tien-mob-multiplier-boss: 6.0             # Ravager, Warden
  tien-mob-boss-ten-rieng-multiplier: 5.0   # Mob có tên riêng (boss custom) nhân thêm
  tien-ma-dao-bonus: 1.2                    # Hệ số cộng thêm cho Ma Đạo
  tien-breakthrough-base-multiplier: 1.0    # Nhân toàn bộ bảng thưởng đột phá (xem BreakthroughManager)
  tien-per-player-kill: 50
  tien-daily-login: 100
  reroll-linh-can-cost: 500
  reroll-toc-cost: 2000
  shop-hoi-mau-cost: 50
  shop-reset-cd-cost: 200
  renduc-tier1-cost: 300
  renduc-tier2-cost: 800
  renduc-tier3-cost: 2000
  renduc-tier4-cost: 8000
  tong-mon-create-cost: 1000


