# TuTien FREE - tuỳ biến 25 slot cảnh giới có sẵn.
# Chỉnh các trường bên dưới rồi dùng /ttadmin reload (hoặc khởi động lại server).
# ID (LUYEN_KHI, TRUC_CO, ...) là khoá nội bộ cố định; không tự thêm ID mới.
# Hiện tại file cho phép đổi tên/màu/cấp tu luyện/ngưỡng LK của 25 slot,
# chưa hỗ trợ thêm số slot cảnh giới mới vì lõi gameplay lưu stage bằng enum.
# Màu dùng mã legacy Minecraft: &f, &a, &6, &l...
# max-rank: từ 1 đến 6. breakthrough-difficulty tuỳ chọn, giá trị > 0 và <= 1.
# can-fly / can-use-all-skills tuỳ chọn; bỏ dòng để dùng quy tắc mặc định.

