name: TuTienPlugin
version: '${project.version}'
main: com.tutien.TuTienPlugin
api-version: '1.21'
description: "Tu Tien Plugin v7 - He thong tu luyen day du + MythicLib/MythicMobs Hook"
authors: [TuTienDev]
depend: []
softdepend: [LuckPerms, Vault, WorldEdit, WorldGuard, GriefPrevention, PlaceholderAPI, BetterHud, MythicLib, MythicMobs, SimplePets, ItemsAdder, Citizens]

commands:
  # ======= LỆNH CHÍNH =======
  tutien:
    description: "Lệnh chính Tu Tiên (chọn môn phái, đạo, thông tin, bảng xếp hạng...)"
    usage: "/tutien <chon|dao|info|skill|layky|items|phabao|reroll|reroll_toc|top|help>"
    aliases: [tt, tx]

  vuottamma:
    description: "Vượt Tâm Ma - Thử thách bắt buộc trước khi độ kiếp (Bán Thánh+)"
    usage: "/vuottamma"
    aliases: [vtm]

  dotpha:
    description: "Kích hoạt Thiên Kiếp lôi đình để đột phá cảnh giới mới"
    usage: "/dotpha"
    aliases: [dp]

  boqua:
    description: "Bỏ qua thông báo sẵn sàng đột phá"
    usage: "/boqua"
    aliases: [bq]

  linhkhi:
    description: "Kiểm tra tiến trình Linh Khí và tốc độ tích lũy tu vi"
    usage: "/linhkhi"
    aliases: [lk]

  # ======= TÚI ĐỒ TRỮ VẬT =======
  tuitutien:
    description: "Mở Túi Trữ Vật Tu Tiên (54 ô bảo lưu vĩnh viễn)"
    usage: "/tuitutien"
    aliases: [ttbag, tuidotutien]

  ttbag:
    description: "Mở Túi Trữ Vật Tu Tiên"
    usage: "/ttbag"

  skill:
    description: "Nhận lại vật phẩm thi triển kỹ năng môn phái"
    usage: "/skill"

  # ======= NHÂN VẬT & KHÍ TỨC =======
  toc:
    description: "Xem thông tin Chủng Tộc và thuộc tính huyết mạch"
    usage: "/toc"

  aura:
    description: "Bật hoặc tắt vòng hào quang Tu Vi phát sáng"
    usage: "/aura [on|off]"
    aliases: [tuvi]

  # ======= LUYỆN CHẾ & PHÁP BẢO =======
  luyen:
    description: "Luyện Đan Dược theo 32 công thức tiên gia"
    usage: "/luyen [tên_đan|danh_sach]"
    aliases: [luyendan, ld]

  renduc:
    description: "Rèn Đúc nâng phẩm giai Pháp Bảo (Hạ ➔ Tiên phẩm)"
    usage: "/renduc"
    aliases: [rd, forge]

  cuonghoa:
    description: "Cường Hóa Pháp Bảo từ +1 đến +10 gia tăng chỉ số"
    usage: "/cuonghoa"
    aliases: [chpb, enhance]

  khamnam:
    description: "Khảm Nạm ngọc thuộc tính (Hỏa, Băng, Lôi) vào Pháp Bảo"
    usage: "/khamnam"
    aliases: [kn, socket]

  dunghop:
    description: "Dung Hợp 2 Pháp Bảo cùng loại để ghép dòng ẩn & thăng phẩm"
    usage: "/dunghop"
    aliases: [dh, fusion]

  linhthuc:
    description: "Gán Linh Thức (kỹ năng tự động theo ngữ cảnh) lên Pháp Bảo"
    usage: "/linhthuc"
    aliases: [lt]

  khilinh:
    description: "Cho Pháp Bảo ăn vật phẩm thừa để tích lũy nuôi Khí Linh"
    usage: "/khilinh"
    aliases: [kl, phapbaopet]

  # ======= TÍNH NĂNG CHIẾN ĐẤU & TU LUYỆN =======
  thiendinh:
    description: "Thiền Định tĩnh tọa hấp thu linh khí tự động"
    usage: "/thiendinh [bat|tat]"
    aliases: [td, meditate]

  trieukiem:
    description: "Triệu hồi Vạn Kiếm Quy Tông hộ thể sau lưng (Kiếm Tu Bán Thánh+)"
    usage: "/trieukiem [mode]"
    aliases: [tk, kiemdao]

  trieuthu:
    description: "Triệu hồi hoặc thu hồi Linh Thú đồng hành tác chiến"
    usage: "/trieuthu"
    aliases: [ls, linhthu, pet]

  hocbidong:
    description: "Lĩnh ngộ bí kíp nội công bị động từ sách trên tay (tối đa 3)"
    usage: "/hocbidong <atk|hp|def|speed|luck|regen>"
    aliases: [hoc, learnpassive]

  bidong:
    description: "Xem danh sách bí kíp bị động đã học"
    usage: "/bidong"
    aliases: [passives, passive]

  doiky:
    description: "Hoán đổi nhánh kỹ năng trong slot Linh Khí Kiếm"
    usage: "/doiky <a|b|c|d>"
    aliases: [changeskill, doikinang]

  ngukiem:
    description: "Ngự Kiếm Phi Hành - Đạp kiếm bay lượn (Kiếm Tu Bán Thánh+)"
    usage: "/ngukiem"
    aliases: [nk, phikiem]

  linhchungshop:
    description: "Mua bán hạt giống Linh Chủng (khóa theo cảnh giới)"
    usage: "/linhchungshop <buy|sell> <herbId> [số_lượng]"
    aliases: [lcshop]

  thao:
    description: "Xem danh sách và dược tính các loài Tiên Thảo"
    usage: "/thao"
    aliases: [thaodoc, herb]

  addlinhzone:
    description: "Tạo khu vực Linh Mạch tăng tốc tu vi (Admin)"
    usage: "/addlinhzone <tên> [bán_kính]"
    permission: tutien.admin
    aliases: [alz]

  # ======= TÔNG MÔN =======
  tongmon:
    description: "Hệ thống Tông Môn / Bang Hội tu tiên"
    usage: "/tongmon <tao|info|moi|kick|roi|rank|kho>"
    aliases: [tm, sect]

  congphap:
    description: "Hệ thống Công Pháp tu tiên do server tùy chỉnh"
    usage: "/congphap <list|info|hoc|trangbi|thi-trien|bo>"
    aliases: [congphapcustom, technique]

  mochieumo:
    description: "Mở hoặc đóng chiêu mộ công khai của Tông Môn (Môn Chủ)"
    usage: "/mochieumo"
    aliases: [mcm]

  kinang:
    description: "Mở giao diện GUI tùy chọn các hệ thống kỹ năng"
    usage: "/kinang"

  # ======= BÁCH NGHỆ & CƠ DUYÊN =======
  bachnghe:
    description: "Bách Nghệ Tu Tiên: 6 nghề phụ, cấp nghề và đặc quyền"
    usage: "/bachnghe <list|info|chon|status|reset>"
    aliases: [nghephu, bachnghesu]

  coduyen:
    description: "Cơ Duyên & Kim Thủ Chỉ: phúc lợi và điểm Hệ Thống"
    usage: "/coduyen <status|help|dung>"
    aliases: [kimthuchi, co-duyen]

  # ======= CẨM NANG HƯỚNG DẪN =======
  guide:
    description: "Cẩm Nang Toàn Tập & Bảng Tra Cứu Toàn Bộ Lệnh (GUI & Text)"
    usage: "/guide [batdau|kiemdao|luyenche|bachnghe|tongmon|lenh|admin]"
    aliases: [hd, huongdan, help]

  # ======= QUẢN TRỊ VIÊN (ADMIN) =======
  ttadmin:
    description: "Toàn bộ lệnh quản trị hệ thống Tu Tiên (Admin / OP)"
    usage: "/ttadmin <help|info|set|give|reset|heal|maxlk|dotpha|zone|bloodmoon|worldboss|season|reload>"
    permission: tutien.admin
    aliases: [tta]

  debug:
    description: "Bật/tắt chế độ ghi log Debug TuTien (Admin)"
    usage: "/debug [on|off]"
    permission: tutien.admin
    aliases: [ttdebug]

  # ======= CÔNG ĐỨC & NHIỆM VỤ =======
  karma:
    description: "Kiểm tra điểm Công Đức và Nghiệp Lực"
    usage: "/karma"
    aliases: [congduc]

  quest:
    description: "Xem và nhận thưởng nhiệm vụ Tu Tiên hàng ngày/tuần"
    usage: "/quest"
    aliases: [nhiemvu, nv]

  party:
    description: "Thành lập tổ đội cùng tu luyện và săn Boss"
    usage: "/party <create|invite|accept|leave|kick|disband|info>"
    aliases: [nhom]

  group:
    description: "Quản lý tổ đội tu tiên (Alias của Party)"
    usage: "/group <create|invite|accept|leave|kick|disband|info>"
    aliases: [grp]

  bloodmoon:
    description: "Quản lý sự kiện Huyết Nguyệt dị tượng (Admin)"
    usage: "/bloodmoon <start|stop|status>"
    permission: tutien.admin
    aliases: [huyetnguyet, hn]

  binhxl:
    description: "Sử dụng Bình Huyết Nguyệt (công, farm, hồi phục)"
    usage: "/binhxl <cong|farm|heal>"
    aliases: [binh, binhhuyet]

  trade:
    description: "Giao dịch vật phẩm an toàn giữa 2 người chơi"
    usage: "/trade <player>"
    aliases: [giaodich, gd]

  tang:
    description: "Tặng vật phẩm trên tay cho đạo hữu"
    usage: "/tang <player>"
    aliases: [gift, cho]

  # ======= SƯ ĐỒ & ĐỆ TỬ =======
  suphu:
    description: "Bái sư hoặc nhận người chơi làm đệ tử chân truyền"
    usage: "/suphu <player>"

  dedoan:
    description: "Quản lý đồ đoàn sư đồ và đệ tử NPC theo sau phò tá"
    usage: "/dedoan [roi|kick <player>|npc <tao|list|stats|xoa> ...]"

  # ======= UY ÁP CẢNH GIỚI =======
  uyap:
    description: "Phóng thích kỹ năng Uy Áp hoặc quản lý chế độ áp chế cảnh giới"
    usage: "/uyap [toggle|on|off|status]"

permissions:
  tutien.admin:
    description: "Quyền Quản Trị Viên cao nhất của TuTienPlugin"
    default: op
  group.admin:
    description: "Quyền Quản Trị Viên quản lý tất cả các Nhóm/Party"
    default: op
  tutien.user:
    description: "Quyền sử dụng các lệnh cơ bản của TuTienPlugin"
    default: true
